# Administrative hierarchy per country, for the State/Province/Most Relevant Sub-National
# Jurisdiction column (Standardization Rules, column 2: "the state the city is located in").
#
# first_level: words that name the country's first-level subdivision (ISO 3166-2 subdivision
#   categories; where a city is itself first-level, e.g. Vienna, Hamburg, Mexico City, the
#   bare name carries no term and passes).
# lower_level: words that name a level below it (county in the US, provincia in Chile, ...).
#
# A jurisdiction value naming a lower level (and no first level) goes to review
# (JURISDICTION_LEVEL); a country not listed here goes to review too
# (JURISDICTION_LEVEL_UNKNOWN), because the level can't be established. Terms match whole
# words, case-insensitively, longest first ("sub-county" is not "county").
version: 1
source: ISO 3166-2 subdivision categories (first level); national usage for lower levels
countries:
  United States of America:
    aliases: [United States, USA, US, U.S.]
    first_level: [state, commonwealth, district of columbia]
    lower_level: [county, parish, borough, census area, township, municipality, city, town, village]
  Canada:
    first_level: [province, territory]
    lower_level: [county, regional municipality, region, district, municipality, city, township, town]
