services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: water_source
      POSTGRES_USER: water
      POSTGRES_PASSWORD: water
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: quay.io/minio/minio:latest  # Docker Hub's minio/minio is no longer pullable
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  searxng:
    image: searxng/searxng:latest
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-change-me-local-only}
    ports:
      - "8080:8080"
    volumes:
      - ./config/searxng/settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped
    profiles: ["discovery"]

volumes:
  postgres_data:
  minio_data:
